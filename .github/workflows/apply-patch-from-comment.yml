name: Apply Patch From Issue Comment
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: read
  pull-requests: read
jobs:
  apply:
    if: startsWith(github.event.comment.body, '/apply')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: ${{ github.event.repository.default_branch }} }
      - uses: actions/github-script@v7
        with:
          script: |
            const github = require('@actions/github');
            const core = require('@actions/core');
            const body = github.context.payload.comment.body;
            const block = (body.match(/```files([\s\S]*?)```/)||[])[1]?.trim();
            if (!block) return core.setFailed('No ```files``` block found.');
            const chunks = block.split(/\n---\n/);
            const {owner, repo} = github.context.repo;
            const branch = github.context.payload.repository.default_branch;
            const octo = github.getOctokit(process.env.GITHUB_TOKEN);
            const updated = [];
            for (const chunk of chunks) {
              const path = (chunk.match(/PATH:\s*(.+)/)||[])[1]?.trim();
              const b64  = (chunk.match(/BASE64:\s*([A-Za-z0-9+\/=\s]+)/)||[])[1]?.replace(/\s+/g,'');
              if (!path || !b64) continue;
              let sha;
              try {
                const r = await octo.rest.repos.getContent({owner, repo, path, ref: branch});
                if (!Array.isArray(r.data)) sha = r.data.sha;
              } catch {}
              await octo.rest.repos.createOrUpdateFileContents({
                owner, repo, path, message: `apply-patch: ${path}`,
                content: b64, branch, sha
              });
              updated.push(path);
            }
            if (!updated.length) return core.setFailed('No valid PATH/BASE64 entries parsed.');
            await octo.rest.reactions.createForIssueComment({
              owner, repo, comment_id: github.context.payload.comment.id, content: '+1'
            });
            core.notice('Updated: ' + updated.join(', '));