name: Android CI (Release APK)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout (recursive submodules)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: 'recursive'

    - name: Ensure submodules are initialized
      run: |
        git submodule sync --recursive
        git submodule update --init --recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept all Android SDK licenses
      run: yes | sdkmanager --licenses

    - name: Install NDK + CMake (match project)
      run: sdkmanager "ndk;25.2.9519653" "cmake;3.22.1"

    - name: Grant execute permission for Gradle
      run: chmod +x gradlew

    - name: Clean caches (fresh CMake/Gradle)
      run: rm -rf app/.cxx ~/.gradle/caches

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: List build outputs
      run: |
        echo "==== app/build/outputs ===="
        find app/build/outputs -type f

    - name: Upload Release APKs
      uses: actions/upload-artifact@v4
      with:
        name: Android-Release-APKs
        path: |
          app/build/outputs/apk/dev/release/*.apk
          app/build/outputs/apk/mainline/release/*.apk
