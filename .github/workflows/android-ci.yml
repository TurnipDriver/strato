name: Android CI (Release APK)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      # 1) Checkout EVERYTHING (deep + recursive)
      - name: Checkout (recursive submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          lfs: false

      # 2) Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3) Android SDK + tools
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept all Android SDK licenses
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses

      # 4) Match project NDK/CMake (adjust if your project wants other versions)
      - name: Install NDK + CMake (match project)
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;26.1.10909125" "cmake;3.22.1"

      # 5) Build
      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Clean caches (fresh CMake/Gradle)
        run: |
          rm -rf app/.cxx || true
          ./gradlew --stop || true
          rm -rf ~/.gradle/caches || true

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      # 6) Show where Gradle put the files (helps debug)
      - name: List build outputs
        run: |
          echo "==== app/build/outputs ===="
          ls -R app/build/outputs || true

      # 7) Upload whatever was produced (APK and/or AAB)
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strato-build
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
          retention-days: 7
